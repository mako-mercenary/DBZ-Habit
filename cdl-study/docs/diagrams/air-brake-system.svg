<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0e1013"/><rect x="8.0" y="1.0" width="84.0" height="10.0" rx="2.0" fill="none" stroke="#e8e6e3" stroke-width="0.5"/><text x="12.0" y="5.3" fill="#e8e6e3" font-size="4.2" font-family="Inter, system-ui, sans-serif" text-anchor="start" font-weight="700">Engine drives the compressor</text><text x="12.0" y="9.3" fill="#6b7280" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="start">by gears or a v-belt</text><line x1="50.0" y1="11.0" x2="50.0" y2="15.8" stroke="#6b7280" stroke-width="0.5"/><polygon points="50.0,15.8 49.0,13.8 51.0,13.8" fill="#6b7280"/><rect x="8.0" y="15.8" width="84.0" height="10.0" rx="2.0" fill="none" stroke="#e3b341" stroke-width="0.5"/><text x="12.0" y="20.1" fill="#e3b341" font-size="4.2" font-family="Inter, system-ui, sans-serif" text-anchor="start" font-weight="700">Governor</text><text x="12.0" y="24.1" fill="#6b7280" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="start">cut-out 125 psi · cut-in 100 psi</text><line x1="50.0" y1="25.8" x2="50.0" y2="30.599998" stroke="#6b7280" stroke-width="0.5"/><polygon points="50.0,30.599998 49.0,28.599998 51.0,28.599998" fill="#6b7280"/><rect x="8.0" y="30.6" width="84.0" height="10.0" rx="2.0" fill="none" stroke="#e3b341" stroke-width="0.5"/><text x="12.0" y="34.9" fill="#e3b341" font-size="4.2" font-family="Inter, system-ui, sans-serif" text-anchor="start" font-weight="700">Air tanks</text><text x="12.0" y="38.9" fill="#6b7280" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="start">safety valve opens at 150 psi</text><line x1="50.0" y1="40.6" x2="50.0" y2="45.399998" stroke="#6b7280" stroke-width="0.5"/><polygon points="50.0,45.399998 49.0,43.399998 51.0,43.399998" fill="#6b7280"/><rect x="8.0" y="45.4" width="84.0" height="10.0" rx="2.0" fill="none" stroke="#e8e6e3" stroke-width="0.5"/><text x="12.0" y="49.7" fill="#e8e6e3" font-size="4.2" font-family="Inter, system-ui, sans-serif" text-anchor="start" font-weight="700">Brake pedal</text><text x="12.0" y="53.7" fill="#6b7280" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="start">harder pedal, more air; fanning wastes it</text><line x1="50.0" y1="55.4" x2="50.0" y2="60.2" stroke="#6b7280" stroke-width="0.5"/><polygon points="50.0,60.2 49.0,58.2 51.0,58.2" fill="#6b7280"/><rect x="8.0" y="60.2" width="84.0" height="10.0" rx="2.0" fill="none" stroke="#e3b341" stroke-width="0.5"/><text x="12.0" y="64.5" fill="#e3b341" font-size="4.2" font-family="Inter, system-ui, sans-serif" text-anchor="start" font-weight="700">Brake chamber, slack adjuster</text><text x="12.0" y="68.5" fill="#6b7280" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="start">over 1 inch of play needs adjusting</text><line x1="50.0" y1="70.2" x2="50.0" y2="75.0" stroke="#6b7280" stroke-width="0.5"/><polygon points="50.0,75.0 49.0,73.0 51.0,73.0" fill="#6b7280"/><rect x="8.0" y="75.0" width="84.0" height="10.0" rx="2.0" fill="none" stroke="#e8e6e3" stroke-width="0.5"/><text x="12.0" y="79.3" fill="#e8e6e3" font-size="4.2" font-family="Inter, system-ui, sans-serif" text-anchor="start" font-weight="700">S-cam turns, shoe meets drum</text><text x="12.0" y="83.3" fill="#6b7280" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="start">friction, then heat, then fade</text><line x1="8.0" y1="35.6" x2="3.5" y2="35.6" stroke="#f87171" stroke-width="0.5"/><line x1="3.5" y1="35.6" x2="3.5" y2="50.4" stroke="#f87171" stroke-width="0.5"/><line x1="3.5" y1="50.4" x2="8.0" y2="50.4" stroke="#f87171" stroke-width="0.5"/><polygon points="8.0,50.4 6.0,51.4 6.0,49.4" fill="#f87171"/><text x="50.0" y="91.0" fill="#f87171" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="middle">pressure falling: warning before 55 psi,</text><text x="50.0" y="96.0" fill="#f87171" font-size="3.4" font-family="Inter, system-ui, sans-serif" text-anchor="middle">spring brakes between 20 and 45 psi</text></svg>